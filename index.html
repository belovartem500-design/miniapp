<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Мой продукт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    :root {
    --bg: #000000;          /* фон */
    --card: #0d0d0d;        /* карточки */
    --border: #1f1f1f;      /* тонкая рамка карточек */
    --text: #ffffff;        /* основной текст */
    --hint: #8a8a8a;        /* серые подписи */
    --accent: #ffffff;      /* кнопки */
    --accent-text: #000000; /* текст на кнопках */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding: 24px 16px 110px; overflow-x: hidden;
  }

  /* Шапка */
  .hero { text-align: center; margin: 8px 0 28px; }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 14px;
    background: var(--card); border: 3px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .sub { color: var(--hint); font-size: 15px; line-height: 1.4; max-width: 320px; margin: 0 auto; }

  /* Карточки, разбросанные по сторонам */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding-bottom: 30px; }
  .card {
        background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 16px 16px 52px;
    position: relative; cursor: pointer; transition: scale .15s;
    animation: pop .4s ease both;
  }
  .card:nth-child(odd)  { rotate: -1.5deg; }
  .card:nth-child(even) { rotate: 1.5deg; translate: 0 28px; }
  .card:active { scale: .96; }
  .icon {
    width: 44px; height: 44px; border-radius: 14px; margin-bottom: 12px;
    background: #161616; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .icon svg { width: 22px; height: 22px; }
  svg.i { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .card h3 { font-size: 15px; margin-bottom: 4px; }
  .card p { font-size: 13px; color: var(--hint); line-height: 1.35; }
  .go {
    position: absolute; right: 12px; bottom: 12px;
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: var(--accent); color: var(--accent-text);
    font-size: 18px; display: flex; align-items: center; justify-content: center;
  }
  .go svg { width: 18px; height: 18px; }
  @keyframes pop { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* Всплывающее окно с подробностями */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    background: var(--card); border-radius: 24px 24px 0 0;
    padding: 28px 20px 36px; max-height: 80vh; overflow-y: auto;
    transform: translateY(100%); transition: transform .3s ease;
  }
  .sheet.show { transform: none; }
  .sheet .icon { width: 56px; height: 56px; border-radius: 18px; margin-bottom: 14px; font-size: 28px; }
  .sheet .icon svg { width: 28px; height: 28px; }
  .sheet h2 { font-size: 22px; margin-bottom: 12px; }
  .sheet .full { font-size: 16px; line-height: 1.5; white-space: pre-line; }
  .close {
    position: absolute; top: 14px; right: 14px; width: 32px; height: 32px;
    border-radius: 50%; border: none; background: var(--bg); color: var(--text); font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .close svg { width: 18px; height: 18px; }
  .avatar svg { width: 44px; height: 44px; }

  /* Кнопка связи внизу */
  .contact {
    position: fixed; left: 16px; right: 16px; bottom: 20px; z-index: 5;
    padding: 16px; border: none; border-radius: 16px;
    background: var(--accent); color: var(--accent-text);
    font-size: 17px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>

  <div class="hero">
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <p class="sub" id="about"></p>
  </div>

  <div class="grid" id="grid"></div>

  <button class="contact" id="contactBtn">Связаться со мной</button>

  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet">
    <button class="close" id="closeBtn"></button>
    <div class="icon" id="sheetIcon"></div>
    <h2 id="sheetTitle"></h2>
    <div class="full" id="sheetText"></div>
  </div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
    tg.ready(); tg.expand();
    tg.setHeaderColor("#000000");
    tg.setBackgroundColor("#000000");
  }

  // Линейные иконки (Lucide, ISC). Эмодзи из data.json подменяются на них;
  // можно также писать название иконки, например "target".
  const ICONS = {
    target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    package: '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="m7.5 4.27 9 5.15"/>',
    trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
    user: '<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
    card: '<rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/>',
    sparkles: '<path d="M9.94 15.5A2 2 0 0 0 8.5 14.06l-6.14-1.58a.5.5 0 0 1 0-.96L8.5 9.94A2 2 0 0 0 9.94 8.5l1.58-6.14a.5.5 0 0 1 .96 0l1.58 6.14a2 2 0 0 0 1.44 1.44l6.14 1.58a.5.5 0 0 1 0 .96l-6.14 1.58a2 2 0 0 0-1.44 1.44l-1.58 6.14a.5.5 0 0 1-.96 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>',
    star: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>',
    gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
    book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
    chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
    zap: '<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
    flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
    phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
    help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
    arrow: '<path d="M7 17 17 7"/><path d="M7 7h10v10"/>',
    close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  };
  const EMOJI = {
    "🎯": "target", "👥": "users", "📦": "package", "🏆": "trophy", "👋": "user", "🙂": "user",
    "💳": "card", "✨": "sparkles", "⭐": "star", "🎁": "gift", "📚": "book", "📖": "book",
    "💬": "chat", "⚡": "zap", "🔥": "flame", "📞": "phone", "❓": "help",
  };

  function svg(name) {
    return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';
  }
  // Ставит SVG-иконку, если знаем её, иначе оставляет исходный эмодзи/текст
  function setIcon(el, value) {
    const v = (value || "").replace(/\uFE0F/g, "").trim();
    const name = ICONS[v] ? v : EMOJI[v];
    if (name) el.innerHTML = svg(name);
    else el.textContent = value || "";
  }

  document.getElementById("closeBtn").innerHTML = svg("close");

  const FALLBACK = { name: "", about: "", contact: "", avatar: "🙂", cards: [] };

  fetch("data.json?t=" + Date.now())
    .then(r => r.ok ? r.json() : FALLBACK)
    .catch(() => FALLBACK)
    .then(render);

  function render(D) {
    document.getElementById("name").textContent = D.name;
    document.getElementById("about").textContent = D.about;

        const av = document.getElementById("avatar");
    if (D.avatar_img) {
      const img = document.createElement("img");
      img.src = D.avatar_img;
      av.appendChild(img);
    } else {
      setIcon(av, D.avatar);
    }

    const grid = document.getElementById("grid");
    D.cards.forEach((c, i) => {
      const el = document.createElement("div");
      el.className = "card";
      el.style.animationDelay = (i * 0.07) + "s";
      const icon = document.createElement("div"); icon.className = "icon"; setIcon(icon, c.icon);
      const h = document.createElement("h3"); h.textContent = c.title;
      const p = document.createElement("p"); p.textContent = c.short;
      const go = document.createElement("button"); go.className = "go"; go.innerHTML = svg("arrow");
      el.append(icon, h, p, go);
      el.onclick = () => openSheet(c);
      grid.appendChild(el);
    });

    document.getElementById("contactBtn").onclick = () => {
      const url = "https://t.me/" + D.contact;
      if (tg && tg.initData) tg.openTelegramLink(url);
      else window.open(url, "_blank");
    };
  }

  const overlay = document.getElementById("overlay");
  const sheet = document.getElementById("sheet");

  function openSheet(c) {
    setIcon(document.getElementById("sheetIcon"), c.icon);
    document.getElementById("sheetTitle").textContent = c.title;
    document.getElementById("sheetText").textContent = c.full;
    overlay.classList.add("show");
    sheet.classList.add("show");
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  }
  function closeSheet() {
    overlay.classList.remove("show");
    sheet.classList.remove("show");
  }
  overlay.onclick = closeSheet;
  document.getElementById("closeBtn").onclick = closeSheet;
</script>
</body>
</html>
